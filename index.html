<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Clareza para Começar no Digital | Clareza Digital</title>

  <meta
    name="description"
    content="Um guia prático para quem quer começar no digital com mais clareza, direção e ação. Inclui plano de 30 dias e acompanhamento durante 4 semanas."
  >

  <meta name="theme-color" content="#0b0b0b">

  <style>
    :root {
      --black: #0b0b0b;
      --black-soft: #151515;
      --gold: #c79a32;
      --gold-light: #e3c36b;
      --white: #ffffff;
      --cream: #faf9f6;
      --cream-dark: #f1eee7;
      --text: #191919;
      --muted: #686868;
      --border: #e5e1d8;
      --green: #155b3b;
      --green-light: #e9f5ee;
      --shadow: 0 20px 60px rgba(0,0,0,.08);
      --radius: 18px;
      --max: 1180px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--white);
      color: var(--text);
      line-height: 1.65;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(92%, var(--max));
      margin: 0 auto;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0,0,0,.07);
    }

    .nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: -.5px;
    }

    .logo span {
      color: var(--gold);
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      transition: .25s ease;
    }

    .nav-link:hover {
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    /* =========================
       BUTTONS
    ========================= */

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 54px;
      padding: 14px 25px;
      border-radius: 999px;
      border: 0;
      cursor: pointer;
      font-weight: 900;
      font-size: 15px;
      transition: .25s ease;
      text-align: center;
    }

    .btn-primary {
      color: #111;
      background: linear-gradient(
        135deg,
        var(--gold-light),
        var(--gold)
      );
      box-shadow: 0 12px 28px rgba(199,154,50,.22);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 35px rgba(199,154,50,.30);
    }

    .btn-dark {
      color: var(--white);
      background: var(--black);
    }

    .btn-dark:hover {
      background: #222;
      transform: translateY(-2px);
    }

    .btn-whatsapp {
      color: #fff;
      background: #16834d;
    }

    .btn-whatsapp:hover {
      background: #126c40;
      transform: translateY(-2px);
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      background:
        radial-gradient(
          circle at 80% 20%,
          rgba(199,154,50,.13),
          transparent 30%
        ),
        linear-gradient(
          180deg,
          #fff,
          #fbfaf7
        );
      padding: 95px 0 80px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      gap: 70px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #f4efe2;
      color: #765a18;
      border: 1px solid #eadbb4;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: clamp(42px, 6vw, 72px);
      line-height: 1.02;
      letter-spacing: -3px;
      max-width: 780px;
      margin-bottom: 24px;
    }

    .hero h1 span {
      color: var(--gold);
    }

    .hero-description {
      max-width: 680px;
      font-size: 19px;
      color: #4f4f4f;
      margin-bottom: 18px;
    }

    .hero-note {
      color: var(--muted);
      font-size: 14px;
      max-width: 650px;
      margin-bottom: 30px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
    }

    .trust-row {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .trust-pill {
      padding: 9px 13px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      color: #555;
    }

    /* BOOK MOCKUP */

    .book-wrap {
      position: relative;
      display: flex;
      justify-content: center;
    }

    .book-shadow {
      position: absolute;
      width: 270px;
      height: 55px;
      background: rgba(0,0,0,.17);
      filter: blur(25px);
      bottom: -8px;
      border-radius: 50%;
    }

    .book {
      position: relative;
      width: 290px;
      min-height: 410px;
      border-radius: 7px 16px 16px 7px;
      background:
        linear-gradient(
          145deg,
          #161616,
          #292929
        );
      box-shadow:
        -10px 10px 0 #b38a2d,
        -20px 20px 0 #9c7626,
        0 30px 70px rgba(0,0,0,.22);
      padding: 36px 30px;
      color: white;
      transform: rotate(2deg);
      overflow: hidden;
    }

    .book::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          circle at 80% 10%,
          rgba(227,195,107,.25),
          transparent 35%
        );
      pointer-events: none;
    }

    .book-small {
      position: relative;
      z-index: 2;
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 10px;
      font-weight: 900;
      margin-bottom: 45px;
    }

    .book h2 {
      position: relative;
      z-index: 2;
      font-size: 37px;
      line-height: 1.04;
      letter-spacing: -1.5px;
      margin-bottom: 20px;
    }

    .book h2 span {
      color: var(--gold-light);
    }

    .book p {
      position: relative;
      z-index: 2;
      color: #d8d8d8;
      font-size: 13px;
      line-height: 1.5;
    }

    .book-author {
      position: absolute;
      z-index: 2;
      bottom: 30px;
      left: 30px;
      font-size: 13px;
      font-weight: 900;
    }

    /* =========================
       SECTIONS
    ========================= */

    section {
      padding: 95px 0;
    }

    .section-soft {
      background: var(--cream);
    }

    .section-dark {
      background: var(--black);
      color: white;
    }

    .section-heading {
      max-width: 760px;
      margin-bottom: 50px;
    }

    .section-heading.center {
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }

    .section-heading .mini {
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    .section-heading h2 {
      font-size: clamp(31px, 4vw, 48px);
      line-height: 1.08;
      letter-spacing: -1.8px;
      margin-bottom: 16px;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 17px;
    }

    .section-dark .section-heading p {
      color: #bcbcbc;
    }

    /* =========================
       PAINS
    ========================= */

    .pain-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 17px;
    }

    .pain-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: 0 10px 35px rgba(0,0,0,.035);
    }

    .pain-number {
      color: var(--gold);
      font-weight: 900;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .pain-card h3 {
      font-size: 20px;
      margin-bottom: 10px;
      line-height: 1.2;
    }

    .pain-card p {
      color: var(--muted);
      font-size: 14px;
    }

    /* =========================
       VSL
    ========================= */

    .vsl {
      background: #0e0e0e;
      color: white;
    }

    .vsl-box {
      max-width: 920px;
      margin: 0 auto;
      text-align: center;
    }

    .video {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid #333;
      border-radius: 18px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 25px 70px rgba(0,0,0,.35);
      margin-bottom: 32px;
    }

    .video iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .vsl-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .vsl-small {
      margin-top: 18px;
      color: #929292;
      font-size: 12px;
    }

    /* =========================
       METHOD
    ========================= */

    .method-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .method-card {
      border: 1px solid var(--border);
      background: white;
      border-radius: var(--radius);
      padding: 28px;
      display: grid;
      grid-template-columns: 55px 1fr;
      gap: 20px;
    }

    .method-letter {
      width: 55px;
      height: 55px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: var(--black);
      color: var(--gold-light);
      font-weight: 1000;
      font-size: 20px;
    }

    .method-card h3 {
      margin-bottom: 7px;
      font-size: 20px;
    }

    .method-card p {
      color: var(--muted);
      font-size: 14px;
    }

    /* =========================
       BENEFITS
    ========================= */

    .benefit-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .benefit {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #fff;
    }

    .benefit-icon {
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--green-light);
      color: var(--green);
      font-weight: 1000;
    }

    .benefit strong {
      display: block;
      margin-bottom: 3px;
      font-size: 15px;
    }

    .benefit span {
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================
       CONTENT
    ========================= */

    .content-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .content-item {
      padding: 22px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 15px;
    }

    .content-item strong {
      display: block;
      margin-bottom: 5px;
    }

    .content-item span {
      color: var(--muted);
      font-size: 14px;
    }

    /* =========================
       30 DAYS
    ========================= */

    .days {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .day-card {
      padding: 27px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .day-card .week {
      color: var(--gold);
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .day-card h3 {
      font-size: 20px;
      margin-bottom: 9px;
    }

    .day-card p {
      color: var(--muted);
      font-size: 14px;
    }

    /* =========================
       SUPPORT
    ========================= */

    .support-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .support-card {
      padding: 25px;
      border: 1px solid #333;
      background: #151515;
      border-radius: var(--radius);
    }

    .support-card span {
      color: var(--gold-light);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .support-card h3 {
      margin: 12px 0 8px;
      font-size: 19px;
    }

    .support-card p {
      color: #aaa;
      font-size: 13px;
    }

    /* =========================
       AUTHOR
    ========================= */

    .author {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 60px;
      align-items: center;
    }

    .author-box {
      min-height: 390px;
      border-radius: 22px;
      background:
        radial-gradient(
          circle at 30% 20%,
          rgba(227,195,107,.18),
          transparent 35%
        ),
        #111;
      display: grid;
      place-items: center;
      color: var(--gold-light);
      font-size: 70px;
      font-weight: 1000;
    }

    .author-text h2 {
      font-size: clamp(32px, 4vw, 48px);
      line-height: 1.05;
      margin-bottom: 20px;
      letter-spacing: -1.5px;
    }

    .author-text p {
      color: var(--muted);
      margin-bottom: 14px;
      font-size: 16px;
    }

    /* =========================
       SOCIAL PROOF
    ========================= */

    .proof-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .proof-card {
      border: 1px dashed #cfc8ba;
      background: #fff;
      border-radius: var(--radius);
      min-height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
      color: #8a847a;
      font-size: 13px;
    }

    .proof-card strong {
      display: block;
      color: #555;
      margin-bottom: 7px;
    }

    /* =========================
       FAQ
    ========================= */

    .faq {
      max-width: 900px;
      margin: 0 auto;
    }

    .faq-item {
      border-bottom: 1px solid var(--border);
    }

    .faq-question {
      width: 100%;
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 22px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      gap: 20px;
      font-size: 16px;
      font-weight: 900;
      color: var(--text);
    }

    .faq-icon {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      border: 1px solid var(--border);
      border-radius: 50%;
      display: grid;
      place-items: center;
      transition: .25s ease;
    }

    .faq-answer {
      display: none;
      padding: 0 45px 22px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .faq-item.active .faq-answer {
      display: block;
    }

    .faq-item.active .faq-icon {
      transform: rotate(45deg);
      background: var(--black);
      color: white;
    }

    /* =========================
       OFFER
    ========================= */

    .offer {
      padding: 110px 0;
      background:
        radial-gradient(
          circle at 50% 0,
          rgba(227,195,107,.20),
          transparent 35%
        ),
        #0b0b0b;
      color: white;
      text-align: center;
    }

    .offer-box {
      max-width: 800px;
      margin: 0 auto;
    }

    .offer h2 {
      font-size: clamp(36px, 5vw, 58px);
      line-height: 1.03;
      letter-spacing: -2px;
      margin-bottom: 15px;
    }

    .offer p {
      color: #aaa;
      max-width: 650px;
      margin: 0 auto 28px;
    }

    .price-label {
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .price {
      font-size: 64px;
      font-weight: 1000;
      line-height: 1;
      margin-bottom: 25px;
    }

    .price small {
      font-size: 20px;
      color: #aaa;
    }

    .included {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      text-align: left;
      margin: 35px 0;
    }

    .included div {
      color: #ddd;
      font-size: 13px;
      padding: 12px 14px;
      border: 1px solid #292929;
      border-radius: 10px;
      background: #121212;
    }

    .offer-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .offer-note {
      margin-top: 20px;
      font-size: 12px;
      color: #777;
    }

    /* =========================
       FINAL MESSAGE
    ========================= */

    .final-message {
      text-align: center;
      padding: 90px 0;
      background: var(--cream);
    }

    .final-message h2 {
      max-width: 760px;
      margin: 0 auto 18px;
      font-size: clamp(32px, 4vw, 50px);
      line-height: 1.08;
      letter-spacing: -1.6px;
    }

    .final-message p {
      max-width: 650px;
      margin: 0 auto 28px;
      color: var(--muted);
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #080808;
      color: #aaa;
      padding: 55px 0 30px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr .8fr;
      gap: 50px;
      padding-bottom: 40px;
      border-bottom: 1px solid #252525;
    }

    .footer-brand strong {
      color: white;
      font-size: 20px;
    }

    .footer-brand p {
      max-width: 390px;
      font-size: 13px;
      margin-top: 12px;
    }

    footer h3 {
      color: white;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .footer-links {
      display: grid;
      gap: 8px;
      font-size: 13px;
    }

    .footer-links a:hover {
      color: var(--gold-light);
    }

    .footer-bottom {
      padding-top: 25px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 11px;
      color: #686868;
    }

    /* =========================
       MOBILE CTA
    ========================= */

    .mobile-cta {
      display: none;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 900px) {

      .hero-grid,
      .author {
        grid-template-columns: 1fr;
      }

      .hero {
        padding-top: 65px;
      }

      .hero-copy {
        text-align: center;
      }

      .hero-description,
      .hero-note {
        margin-left: auto;
        margin-right: auto;
      }

      .hero-actions,
      .trust-row {
        justify-content: center;
      }

      .book-wrap {
        margin-top: 30px;
      }

      .pain-grid,
      .support-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .days {
        grid-template-columns: repeat(2, 1fr);
      }

      .author-box {
        min-height: 300px;
      }

      .footer-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 650px) {

      body {
        padding-bottom: 78px;
      }

      section {
        padding: 70px 0;
      }

      .nav {
        min-height: 62px;
      }

      .nav-link {
        padding: 8px 13px;
        font-size: 12px;
      }

      .hero {
        padding: 55px 0 65px;
      }

      .hero h1 {
        font-size: 43px;
        letter-spacing: -2px;
      }

      .hero-description {
        font-size: 17px;
      }

      .hero-actions,
      .vsl-actions,
      .of
